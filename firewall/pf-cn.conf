# =============================================================================
# PHASE 2 Extension C — main pf ruleset used ONLY during the demo.
#
# WHY this file exists instead of just loading the anchor directly:
# rules inside a pf anchor are only evaluated if the MAIN ruleset references
# that anchor. macOS's /etc/pf.conf only references Apple's own anchor, so
# `pfctl -a cn-backend -f ...` on its own would load our rules and then never
# run them. This file is a copy of the macOS default ruleset PLUS our anchor,
# so Apple's rules keep working while ours are actually evaluated.
#
# Load with   firewall/enable-isolation.sh
# Roll back with firewall/disable-isolation.sh
# =============================================================================

# --- macOS defaults, kept intact (order matters in pf: scrub -> nat/rdr -> filter)
scrub-anchor "com.apple/*"
nat-anchor "com.apple/*"
rdr-anchor "com.apple/*"
dummynet-anchor "com.apple/*"
anchor "com.apple/*"
load anchor "com.apple" from "/etc/pf.anchors/com.apple"

# --- our backend isolation rules ---
anchor "cn-backend"
load anchor "cn-backend" from "/etc/pf.anchors/cn-backend"
