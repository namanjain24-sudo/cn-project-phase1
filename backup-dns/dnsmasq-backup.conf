# =============================================================================
# PHASE 2 Extension A — BACKUP DNS RESOLVER
# Runs on Mac 3 (Hemanth), NOT Mac 1. Same records as the primary.
#
# The spec requires a second resolver on a different machine so that stopping
# the primary (Mac 1) does not stop name resolution for the whole team.
#
# Replace cn_team.test / 10.7.11.169 / 10.7.25.47, or run scripts/set-ips.sh.
# =============================================================================

# --- Same private records as Mac 1. These MUST match the primary, otherwise
#     failover would silently send clients somewhere else. ---
address=/app.cn_team.test/10.7.11.169
address=/api.cn_team.test/10.7.11.169

# --- Ext B: same short TTL as the primary, so TTL behaviour is identical
#     no matter which resolver answered. ---
local-ttl=30

# --- Listen on THIS machine (Mac 3), not Mac 1 ---
listen-address=127.0.0.1,10.7.25.47
bind-interfaces
port=53

# --- Forward non-project names upstream so clients keep normal internet ---
server=8.8.8.8
server=1.1.1.1

log-queries
log-facility=/opt/homebrew/var/log/dnsmasq-backup.log
