# nginx config for the edge / reverse proxy / load balancer (Mac 2) — Tasks D + E
# Real config for Harsha's machine — IPs already filled in, confirmed 2026-09-30.

upstream app_backend {
    server 10.7.12.33:3001;   # Backend A — Hemanth's Mac
    server 10.7.1.139:3002;   # Backend B — Akshay's Mac
}

# Redirect plain HTTP to HTTPS
server {
    listen 80;
    # listen 8080;   # use this instead if 80 is blocked on your machine
    server_name app.cn_team.test api.cn_team.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # listen 8443 ssl;   # use this instead if 443 is blocked on your machine
    http2 on;

    server_name app.cn_team.test api.cn_team.test;

    # Task E — TLS termination happens HERE, at the edge. Backends never see TLS.
    # NOTE: nginx resolves relative paths against ITS OWN config directory
    # (/opt/homebrew/etc/nginx/), not against mac2-edge/ — so these must be absolute,
    # and the cert files must be copied to /opt/homebrew/etc/nginx/certs/ (see README step 6).
    ssl_certificate     /opt/homebrew/etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://app_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If a backend is completely unreachable, try the next one before giving up
        # (this is what makes "one backend stopped" transparent to the client — §6.3 #3)
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
    }
}
